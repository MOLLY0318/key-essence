    with: '大西洋雪松、尤加利、歐洲赤松、野薄荷、胡椒薄荷、馬鬱蘭、岩蘭草' },
  'AR-007': { help: '甜橙和紅橘溫柔的果香讓人放鬆，山雞椒帶來清新的檸檬感，大西洋雪松的木質香讓心安定下來。簡單、安靜，適合想讓自己慢下來、專注在當下的時候。', name: '禪', mood: '柑橘與雪松的安靜香氣',

    with: '真正薰衣草、醒目薰衣草、羅馬洋甘菊、苦橙葉、甜橙、紅橘、佛手柑' },
  'AR-009': { help: '依蘭和大馬士革玫瑰濃郁的花香，被香草和肉桂包得暖暖的，廣藿香和芳樟讓香氣更有層次。像回到一個被好好對待的家，適合想讓空間變溫暖的時候。', name: '生活享受', mood: '溫暖、像家一樣的花香',
    with: '依蘭、大馬士革玫瑰、香草、甜橙、芳樟、錫蘭肉桂、廣藿香' },

    with: '生薑、錫蘭肉桂、黑胡椒、甜橙、香脂冷杉、萊姆、藏茴香、小荳蔻、丁香、月桂' }

// 空白：接收來的，給比較沉、安定的；有定義：自己的能量卡住，給比較明亮、有推動力的
const PAIRS = {
  head:   { open: ['AR-002', '沉靜下來，讓接收來的思緒先停一停。'],
            defined: ['AR-006', '清爽通透，讓自己的想法有出口。裡面也有岩蘭草，跟你的單方同一個方向。'] },
  ajna:   { open: ['AR-004', '薰衣草的柔，陪你接受「現在還不確定」也沒關係。'],
            defined: ['AR-005', '清爽有力，陪你把已經知道的說出來。'] },
  throat: { open: ['AR-007', '安靜下來，等被問的時候再說。'],
            defined: ['AR-003', '明亮外放，陪你把一直沒說出口的話說出來。'] },
  g:      { open: ['AR-009', '先讓空間變得溫暖、對味，對的地方會帶出對的方向。'],
            defined: ['AR-008', '先休息，回到自己的節奏。'] },
  ego:    { open: ['AR-010', '被好好撫慰，你不需要證明什麼。'],
            defined: ['AR-007', '撐得住的人，也要讓自己靜下來。'] },
  sacral: { open: ['AR-008', '借來的能量用完了，先躺下來充電。'],
            defined: ['AR-011', '把自己的動力找回來，用在真正想做的事。'] },
  solar:  { open: ['AR-002', '有乳香陪著，比較不容易被別人的情緒帶走。'],
            defined: ['AR-010', '情緒像潮汐，被撫慰著，等它流過去。'] },
  spleen: { open: ['AR-006', '淨化、守住界線，讓別人的擔心留在外面。'],
            defined: ['AR-005', '支持身體自己的力量，好好聽身體的提醒。'] },
  root:   { open: ['AR-002', '別人的時間壓力，先讓自己停下來。'],
            defined: ['AR-011', '把自己的推動力，用在準備好的那一步。'] }
};

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  const q = new URLSearchParams(location.search);
  const key = q.get('c');
  const state = q.get('s') === 'defined' ? 'defined' : 'open';
  const c = CENTERS[key];
  const page = document.getElementById('page');
  if (!c) {
    page.innerHTML = '<div class="wrap missing"><p>找不到這個中心的推薦。</p><a class="btn" href="index.html">去做九大能量中心狀態掃描</a></div>';
    return;
  }
  const oil = OILS[c.oil];
  const [blendId, reason] = PAIRS[key][state];
  const blend = BLENDS[blendId];
  const label = state === 'open' ? '空白' : '有定義';
  // 兩種內容：預設是「延伸解讀」（不放商品）；v=oil 是「深入了解」精油介紹＋選購（Molly 2026-10-24 要求分開）
  const isOil = q.get('v') === 'oil';
  const base = `?c=${key}&s=${state}`;
  document.title = `${c.name}｜${label}・${isOil ? '陪你的香氣' : '延伸解讀'}｜鑰．本質 Key Essence`;

  const hero = `
    <section class="hero">
      <div class="eyebrow">${isOil ? '深入了解・陪你的香氣' : '延伸解讀'}</div>
      <h1>${esc(c.name)}<em>｜</em>${label}</h1>
      <p>${esc(c.title)}</p>
      <div class="pic"><img src="images/xiaoyue-${key}-calm.jpg" alt="${esc(c.name)}：放鬆下來的小鑰"></div>
    </section>`;
  const tail = `
      <section class="book">
        <p>想更深入了解自己人類圖的不同面向，歡迎預約人類圖陪伴，線上或實體都可以。</p>
        <a class="btn ghost" href="${BOOK}">到官方 LINE 預約人類圖陪伴</a>
      </section>

      <p class="foot"><a href="index.html" style="color:inherit">再做一次九大能量中心狀態掃描</a><br>© 鑰．本質 Key Essence</p>
    </div>`;

  if (!isOil) {
    page.innerHTML = hero + `
    <div class="wrap">
      <section class="read">
        <h3>你的${esc(c.name)}是${label}</h3>
        <p>${esc(EXPLAIN[key][state])}</p>
      </section>

      <section class="read">
        <h3>這週，可以這樣照顧自己</h3>
        <p class="ask">${esc(c.ask)}</p>
        <p class="tip">${esc(oil.use)}</p>
      </section>

      <section class="oil next">
        <div class="kind">陪你的香氣</div>
        <p>單方：<b>${esc(oil.name)}</b>　擴香：<b>${esc(blend.name)} 複方</b></p>
        <a class="btn" href="${base}&v=oil">深入了解這兩支精油 ›</a>
      </section>` + tail;
    return;
  }

  page.innerHTML = hero + `
    <div class="wrap">
      <p class="back"><a href="${base}">‹ 回到延伸解讀</a></p>

      <section class="oil">
        <div class="kind">① 單方精油</div>
        <h2>${esc(oil.name)}</h2>
        <div class="meta">萃取部位：${esc(oil.part)}・${esc(oil.size)}</div>
        <h3>為什麼是它</h3>
        <p>${esc(oil.why)}</p>
        <h3>也可以選</h3>
        <p>家裡有其中一支就可以，聞聞看，選你最喜歡的那個味道。</p>
        ${ALT[c.oil].map(([n, id, why]) => `
        <div class="alt">
          <div class="alt-name">${esc(n)}</div>
          <p>${esc(why)}</p>
          <a class="chip" href="${buy([id])}">選購 ${esc(n)}</a>
        </div>`).join('')}
        <a class="btn" href="${buy([c.oil])}">選購 ${esc(oil.name)}</a>
      </section>

      <section class="oil">
        <div class="kind">② 想用擴香的話</div>
        <h2>${esc(blend.name)} 複方</h2>
        <div class="meta">普羅芳擴香複方・30ml・${esc(blend.mood)}</div>
        <h3>為什麼適合${label}的你</h3>
        <p>${esc(reason)}</p>
        <h3>這個配方怎麼陪你</h3>
        <p>${esc(blend.help)}</p>
        <h3>配方裡有</h3>
        <p>${esc(blend.with)}</p>
        <h3>怎麼用</h3>
        <p class="tip">滴 3～5 滴在不加熱的擴香儀裡，大約適合 9～15 平方公尺的房間。</p>
        <a class="btn" href="${buy([blendId])}">選購 ${esc(blend.name)} 複方</a>
      </section>

      <section class="more-shop">
        <a class="btn" href="${buy([c.oil, blendId])}">單方＋擴香一起選購</a>
        <a class="btn ghost" href="../shop.html">還想看看其他精油 ›</a>
      </section>

      <p class="note">選購按鈕會打開鑰．本質的精油選購頁，把選的品項加進清單（已經選的會保留），還可以繼續挑其他品項，確認後再傳給 Molly，不會直接扣款。<br>
      精油以嗅聞為主；要塗抹在皮膚上請先稀釋。擴香時，2 歲以下孩子的房間先不要用；懷孕、哺乳、嬰幼兒、氣喘、癲癇、慢性病或正在服藥的人，使用前請先諮詢專業人員。複方成分以瓶身標籤為準。</p>
      <p class="back"><a href="${base}">‹ 回到延伸解讀</a></p>` + tail;
}

render();
</script>
